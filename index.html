<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huyền Vi Kinh Dịch - AI</title>
    <link rel="icon" href="/favicon.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VRCE59EGKY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

  <!-- Removed CDN Tailwind for production safety. Use local Tailwind via PostCSS (see README / docs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Google Sans Flex', 'Google Sans', Roboto, sans-serif;
        background-color: #05030a; /* Darkest purple/black */
        color: #f3f4f6; /* gray-100 */
      }
      .font-app {
        font-family: 'Google Sans Flex', 'Google Sans', Roboto, sans-serif;
      }
      .coin-face {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      @keyframes spin-coin {
        0% { transform: rotateY(0) rotateX(0); }
        100% { transform: rotateY(1080deg) rotateX(360deg); }
      }
      .animate-spin-coin {
        animation: spin-coin 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      /* Product bottom sheet: light seam, sheen sweep, breathing glow */
      @keyframes sheet-seam {
        to { background-position: -200% 0; }
      }
      .animate-sheet-seam {
        background-size: 200% 100%;
        animation: sheet-seam 3s linear infinite;
      }
      @keyframes sheet-sheen {
        0% { left: -60%; }
        45%, 100% { left: 130%; }
      }
      .animate-sheet-sheen {
        animation: sheet-sheen 3.6s ease-in-out infinite;
      }
      @keyframes sheet-breathe {
        0%, 100% { box-shadow: 0 -8px 26px rgba(168,85,247,0.16); }
        50% { box-shadow: 0 -12px 36px rgba(168,85,247,0.30); }
      }
      .animate-sheet-breathe {
        animation: sheet-breathe 3.2s ease-in-out infinite;
      }
      /* Floating card variant (ProductSlideIn) — not anchored to an edge, so the glow
         needs to sit evenly around the card instead of offset toward one side. */
      @keyframes panel-breathe {
        0%, 100% { box-shadow: 0 20px 45px -12px rgba(0,0,0,0.5), 0 0 22px rgba(168,85,247,0.14); }
        50% { box-shadow: 0 20px 45px -12px rgba(0,0,0,0.5), 0 0 32px rgba(168,85,247,0.28); }
      }
      .animate-panel-breathe {
        animation: panel-breathe 3.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-sheet-seam, .animate-sheet-sheen, .animate-sheet-breathe, .animate-panel-breathe {
          animation: none;
        }
      }
      /* Background ambience: slow-drifting nebula orbs + a two-layer twinkling starfield,
         evoking cosmic motion behind the app. Pure CSS (transform/background-position),
         cheap to run on mobile. */
      @keyframes orb-drift-a {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(4vw, 3vh) scale(1.12); }
      }
      @keyframes orb-drift-b {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-3vw, -4vh) scale(1.08); }
      }
      .animate-orb-a { animation: orb-drift-a 16s ease-in-out infinite; }
      .animate-orb-b { animation: orb-drift-b 20s ease-in-out infinite; }

      .stars-far, .stars-near {
        background-repeat: repeat;
      }
      .stars-far {
        background-image:
          radial-gradient(1px 1px at 10% 20%, #fff, transparent 100%),
          radial-gradient(1px 1px at 35% 65%, #fff, transparent 100%),
          radial-gradient(1.2px 1.2px at 60% 15%, #d8b4fe, transparent 100%),
          radial-gradient(1px 1px at 80% 80%, #fff, transparent 100%),
          radial-gradient(1px 1px at 25% 90%, #fff, transparent 100%),
          radial-gradient(1.2px 1.2px at 92% 40%, #d8b4fe, transparent 100%),
          radial-gradient(1px 1px at 50% 50%, #fff, transparent 100%),
          radial-gradient(1px 1px at 5% 55%, #fff, transparent 100%);
        background-size: 260px 260px;
        opacity: 0.5;
        animation: star-drift-far 45s linear infinite, star-twinkle 6s ease-in-out infinite;
      }
      .stars-near {
        background-image:
          radial-gradient(1.5px 1.5px at 15% 30%, #fff, transparent 100%),
          radial-gradient(1.5px 1.5px at 45% 75%, #d8b4fe, transparent 100%),
          radial-gradient(1.8px 1.8px at 70% 20%, #fff, transparent 100%),
          radial-gradient(1.5px 1.5px at 88% 60%, #fff, transparent 100%),
          radial-gradient(1.8px 1.8px at 30% 10%, #d8b4fe, transparent 100%);
        background-size: 340px 320px;
        opacity: 0.7;
        animation: star-drift-near 32s linear infinite, star-twinkle 4.5s ease-in-out infinite reverse;
      }
      @keyframes star-drift-far {
        from { background-position: 0 0; }
        to { background-position: -400px 200px; }
      }
      @keyframes star-drift-near {
        from { background-position: 0 0; }
        to { background-position: 300px -260px; }
      }
      @keyframes star-twinkle {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-orb-a, .animate-orb-b, .stars-far, .stars-near {
          animation: none;
        }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0720; 
      }
      ::-webkit-scrollbar-thumb {
        background: #7c3aed; /* violet-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
