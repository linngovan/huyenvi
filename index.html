  <!-- Removed CDN Tailwind for production safety. Use local Tailwind via PostCSS (see README / docs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Google Sans Flex', 'Google Sans', Roboto, sans-serif;
        background-color: #05030a; /* Darkest purple/black */
        color: #f3f4f6; /* gray-100 */
      }
      .font-app {
        font-family: 'Google Sans Flex', 'Google Sans', Roboto, sans-serif;
      }
      .coin-face {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      @keyframes spin-coin {
        0% { transform: rotateY(0) rotateX(0); }
        100% { transform: rotateY(1080deg) rotateX(360deg); }
      }
      .animate-spin-coin {
        animation: spin-coin 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0720; 
      }
      ::-webkit-scrollbar-thumb {
        background: #7c3aed; /* violet-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
